services:
  # Python Flask Backend Web Service
  - type: web
    name: ntis-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      - key: DEMO_MODE
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0

  # React Frontend Static Site
  - type: web
    name: ntis-frontend
    runtime: static
    rootDir: thermal-watch-ai
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ntis-backend
          property: host
